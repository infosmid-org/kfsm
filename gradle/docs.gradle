apply plugin: 'org.jetbrains.dokka'
apply plugin: 'org.asciidoctor.jvm'


asciidoc {
    publications {
        main {
            sourceSet {
                sourceDir = 'src/docs/asciidoc'
                sources {
                    include 'index.adoc'
                }
                resources {
                    include '**/*.png'
                    include '**/*.xml'
                    include '**/*.js'
                    include '**/*.css'
                }
                attributes {
                    addAll 'toc': 'left',
                        'idprefix': '',
                        'idseparator': '-',
                        'docinfo1': ''
                }
                missingIncludesAreFatal()
            }
            output 'asciidoctorj', 'html'
        }
    }
}

task docs(type: Zip, dependsOn: ['asciidoctorHtml', 'dokkaGeneratePublicationHtml']) {
    archiveBaseName = project.name
    archiveClassifier = 'doc'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(file('build/docs/asciidoc/html'))

    from(file('build/dokka/html')) {
        into('javadoc')
    }
}

publishing {
    publications {
        documentation(MavenPublication) {
            artifactId = 'kfsm-doc'
            artifact docs
        }
    }
}
