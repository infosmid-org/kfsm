[versions]
kotlin = "2.4.21"
agp = "9.1.1"
dokka = "2.2.0"
coroutines = "1.11.0"
kfsmViz = "2.0.1"
kfsmVizPlugin = "2.0.2"
dbc = "1.0.0"
local-properties = "1.0.2"
asciidoctorPlugin = "5.0.3"
asciidoctorTabs = "1.0.0.beta.6"
plantuml = "1.2026.9"

maven-publish-plugin = "0.37.0"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

kotlinx-coroutines-jvm = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "coroutines" }
kotlinx-coroutines-js = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-js", version.ref = "coroutines" }
kotlinx-coroutines-iosarm64 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-iosarm64", version.ref = "coroutines" }
kotlinx-coroutines-wasm-js = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-wasm-js", version.ref = "coroutines" }
kotlinx-coroutines-wasm-wasi = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-wasm-wasi", version.ref = "coroutines" }
kotlinx-coroutines-macosarm64 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-macosarm64", version.ref = "coroutines" }
kotlinx-coroutines-iossimulatorarm64 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-iossimulatorarm64", version.ref = "coroutines" }

kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kfsm-viz = { module = "org.infosmid:kfsm-viz", version.ref = "kfsmViz" }
dbc = { module = "org.infosmid:design-by-contract", version.ref = "dbc" }
plantuml = { module = "net.sourceforge.plantuml:plantuml", version.ref = "plantuml" }
asciidoctor-tabs = { module = "rubygems:asciidoctor-tabs", version.ref = "asciidoctorTabs" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
asciidoctorj = { id = "org.asciidoctor.jvm", version.ref = "asciidoctorPlugin" }
asciidoctorjGems = { id = "org.asciidoctor.jvm.gems", version.ref = "asciidoctorPlugin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish-plugin" }
infosmid-local-properties = { id = "org.infosmid.plugins.local-properties", version.ref = "local-properties" }
infosmid-kfsm-viz = { id = "org.infosmid.plugins.kfsm-viz", version.ref = "kfsmVizPlugin" }
