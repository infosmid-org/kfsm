# Publishes milestones, release candidates and releases to Maven Central.
# Push a tag such as v1.0.0, v1.1.0-M1 or v1.1.0-RC1 to start this workflow.
# The version comes from the tag. The leading "v" is removed.
# Maven Central does not let you delete or replace a published version.
name: Release to Maven Central

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test-macos:
    permissions:
      packages: read
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test and publish to GitHub Packages
        run: ./gradlew macosArm64Test iosSimulatorArm64Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  release:
    needs: test-macos
    runs-on: ubuntu-latest
    # Optional: add required reviewers to this environment for a manual approval step.
    environment: maven-central
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Get the version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(M|RC)[0-9]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not v<major>.<minor>.<patch>[-M<n>|-RC<n>]."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build -PreleaseVersion=${{ steps.version.outputs.version }}
      - name: Sign and publish to Maven Central and Github Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository publishAndReleaseToMavenCentral -PreleaseVersion=${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
      - name: Apply version to release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh ./update-release-notes.sh "./RELEASE_NOTES_SUBST.md"
      - uses: ncipollo/release-action@v1
        with:
          bodyFile: "RELEASE_NOTES_SUBST.md"
          allowUpdates: true
          generateReleaseNotes: true
