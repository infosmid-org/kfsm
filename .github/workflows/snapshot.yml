name: Publish snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
#      - name: Setup Graphviz
#        uses: ts-graphviz/setup-graphviz@v2
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build, test
        run: ./gradlew build
  test-macos:
    permissions:
      packages: read
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test and publish to GitHub Packages
        run: ./gradlew macosArm64Test iosSimulatorArm64Test
  publish:
    runs-on: ubuntu-latest
    needs:
      - test-macos
      - snapshot
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
#      - name: Setup Graphviz
#        uses: ts-graphviz/setup-graphviz@v2
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and publish to GitHub Packages
        run: ./gradlew assemble publishKotlinMultiplatformPublicationToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
