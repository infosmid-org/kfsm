# Publishes SNAPSHOT versions to GitHub Packages.
# This workflow runs for each push to main. It uses the GITHUB_TOKEN. It does not use other secrets.
name: Publish snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-snapshot
  cancel-in-progress: true

jobs:
  test-macos:
    permissions:
      packages: read
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test and publish to GitHub Packages
        run: ./gradlew macosArm64Test iosSimulatorArm64Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  snapshot:
    runs-on: ubuntu-latest
    needs: test-macos
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build, test and publish to GitHub Packages
        run: ./gradlew build publishMavenPublicationToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
