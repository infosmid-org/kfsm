asciidoc {
    publications {
        main {
            sourceSet {
                sourceDir = 'src/docs/asciidoc'
                sources {
                    include 'index.adoc'
                }
                resources {
                    include '**/*.png'
                    include '**/*.xml'
                    include '**/*.js'
                    include '**/*.css'
                }
                attributes {
                    addAll 'toc': 'left',
                        'idprefix': '',
                        'idseparator': '-',
                        'docinfo1': '',
                        // Lets index.adoc link to the API docs: link:{api-docs}/index.html[API]
                        'api-docs': 'api'
                }
                missingIncludesAreFatal()
            }
            output 'asciidoctorj', 'html'
        }
    }
}

// The docs zip has its own publication (kfsm-doc) so it never goes to Maven Central.
