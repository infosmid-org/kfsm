def getVersionFromFile() {
    def versionFile = new File(rootProject.projectDir, 'version.txt')
    return versionFile.text.trim()
}

group = 'org.infosmid'
version = providers.gradleProperty('releaseVersion').getOrNull() ?: getVersionFromFile()
description = 'Kotlin Finite-state machine with DSL'

configurations {
    plantuml
}
configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'org.jruby' && details.requested.name == 'jruby-complete') {
            details.useVersion('9.4.8.0')
            details.because('Workaround for setJrubyJarProvider incompatibility in JRuby >= 10.1.0.0')
        }
    }
}

