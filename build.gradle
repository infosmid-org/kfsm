project.afterEvaluate {
    def envVar = System.getenv('GRAPHVIZ_DOT')
    if (envVar) {
        def dot = file(envVar)
        if (!dot.exists()) {
            throw new RuntimeException("Could not find $dot")
        }
    } else {
        def dotFile = new File('/usr/bin/dot')
        if (!dotFile.exists()) {
            def visitor = new SimpleFileVisitor<java.nio.file.Path>() {
                @Override
                public FileVisitResult visitFile(java.nio.file.Path file, BasicFileAttributes attrs) {
                    def found = file.normalize().toFile()
                    if(found.name == "dot" && found.canExecute()) {
                        dotFile = found
                        return FileVisitResult.TERMINATE
                    }
                    return FileVisitResult.CONTINUE;
                }

                @Override
                public FileVisitResult preVisitDirectory(java.nio.file.Path dir, BasicFileAttributes attrs) {
                    // Continue into the directory
                    return FileVisitResult.CONTINUE;
                }

                @Override
                public FileVisitResult visitFileFailed(java.nio.file.Path file, IOException exc) {
                    if (exc instanceof AccessDeniedException) {
                        return FileVisitResult.SKIP_SUBTREE;
                    } else {
                        return FileVisitResult.CONTINUE;
                    }
                }

                @Override
                FileVisitResult postVisitDirectory(java.nio.file.Path dir, IOException exc) throws IOException {
                    if (exc instanceof AccessDeniedException) {
                        return FileVisitResult.SKIP_SUBTREE;
                    } else {
                        return FileVisitResult.CONTINUE;
                    }
                }
            }
            logger.lifecycle("searching for dot from /")
            Files.walkFileTree(java.nio.file.Path.of('/'), Set<FileVisitor>.of(), 5, visitor)
            if(dotFile == null) {
                logger.lifecycle("searching for dot from ${java.nio.file.Path.of('.').normalize().toFile().absoluteFile}")
                Files.walkFileTree(java.nio.file.Path.of('.'), Set<FileVisitor>.of(), 5, visitor)
            }
            if(dotFile == null || !dotFile.exists()) {
                logger.warn("GRAPHVIZ_DOT env var not found and dot not found")
            } else {
                logger.lifecycle("dot:$dotFile")
            }
        }
    }
}

