buildscript {
    repositories {
        mavenLocal()
        maven {
            content {
                includeGroupAndSubgroups 'org.infosmid'
            }
            name = "GitHubPackages-kfsm-viz"
            // Replace ORG_NAME with your GitHub Organization name
            url = uri("https://maven.pkg.github.com/infosmid-org/kfsm-viz")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: rootProject.findProperty('github.user')
                password = System.getenv("GITHUB_TOKEN") ?: rootProject.findProperty('github.token')
            }
        }
        maven {
            content {
                includeGroupAndSubgroups 'org.infosmid.plugins'
            }
            name = "GitHubPackages-kfsm-viz-plugin"
            // Replace ORG_NAME with your GitHub Organization name
            url = uri("https://maven.pkg.github.com/infosmid-org/kfsm-viz-plugin")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: rootProject.findProperty('github.user')
                password = System.getenv("GITHUB_TOKEN") ?: rootProject.findProperty('github.token')
            }
        }
        google()
        gradlePluginPortal()
        mavenCentral()

    }
}

