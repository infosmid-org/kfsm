                useKarma {
                    useChromeHeadless()
                }
            }
        }
        nodejs()
    }
    wasmWasi {
        nodejs()
    }
    js {
        browser()
        nodejs()
    }
    sourceSets {
        configureEach {
            languageSettings.optIn("kotlin.RequiresOptIn")
        }
        commonMain {
            dependencies {
                api libs.kotlinx.coroutines.core
            }
        }
        commonTest {
            dependencies {
                implementation libs.kotlin.test
                implementation libs.kotlinx.coroutines.test
            }
        }
        jvmMain {
            dependencies {
                api libs.kotlin.reflect
                implementation libs.kfsm.viz
            }
        }
        jvmTest {
            dependencies {
                implementation libs.kotlin.test.junit5
                implementation libs.kfsm.viz
            }
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
tasks.withType(KotlinTest).configureEach {
    reports.junitXml.required = true
}

dokka {
    // Samples may belong to only one source set
    dokkaSourceSets.matching { it.name == 'jvm' }.configureEach {
        samples.from(
            'src/commonTest/kotlin/org/infosmid/kfsm/example/TurnstileTypes.kt',
            'src/commonTest/kotlin/org/infosmid/kfsm/example/ImmutableLockFSM.kt',
            'src/commonTest/kotlin/org/infosmid/kfsm/example/LockTypes.kt',
            'src/commonTest/kotlin/org/infosmid/kfsm/example/PayingTurnstileTypes.kt',
            'src/commonTest/kotlin/org/infosmid/kfsm/example/SecureTurnstile.kt'
        )
    }
}

tasks.register('copyPng', Copy) {
    from(projectDir) {
        include '*.png'
    }
    into "${layout.buildDirectory.asFile.get()}/docs/asciidoc"
}



tasks.register('renderPlantUml', JavaExec) {
    description = 'Render src/docs/plantuml/*.plantuml to PNG in src/docs/asciidoc'
    def input = fileTree('src/docs/plantuml') { include '*.plantuml' }
    def output = file('src/docs/asciidoc')
    inputs.files(input)
    outputs.dir(output)
    classpath = configurations.plantuml
    mainClass = 'net.sourceforge.plantuml.Run'
    args(['-tpng', '-o', output.absolutePath] + input.files.collect { it.absolutePath })
}

asciidoctorHtml.dependsOn('copyPng')

project.afterEvaluate {
    def envVar = System.getenv('GRAPHVIZ_DOT')
    if (envVar) {
        def dot = file(envVar)
        if (!dot.exists()) {
            throw new RuntimeException("Could not find $dot")
        }
    } else {
        def dotFile = new File('/usr/bin/dot')
        if (!dotFile.exists()) {
            dotFile = Files.walk(Path.of('/')).filter { Files.isRegularFile(it) }.map { it.normalize().toFile() }.filter {it.name == 'dot' }.findFirst().orElse(null)
            if(dotFile == null || !dotFile.exists()) {
                logger.warn("GRAPHVIZ_DOT env var not found and dot not found")
            }
        }
    }
}

assemble.dependsOn('generateFsmViz')
docs.dependsOn('generateFsmViz')

